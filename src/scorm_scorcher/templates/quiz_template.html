<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{TITLE}} — Quiz</title>
  <link rel="stylesheet" href="branding.css" />
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #0d1b2a; }
    #quiz-container { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
    h2 { font-size: 1.1rem; margin-bottom: 16px; }
    label { display: block; margin: 8px 0; cursor: pointer; }
    button { margin-top: 16px; padding: 10px 20px; background: #0077cc; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #005fa3; }
    #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
  </style>
  <script>
    let quizData = {{QUIZ_DATA}}.questions || [];
    let current = 0;
    let score = 0;
    let API = null;

    function initScorm() {
      try {
        API = window.API || (window.parent && window.parent.API) || null;
        if (API) API.LMSInitialize('');
      } catch (e) {}
    }

    function showQuestion() {
      const container = document.getElementById('quiz-container');
      const q = quizData[current];
      let html = `<h2>Question ${current + 1} of ${quizData.length}</h2><p>${q.prompt}</p><form id="quiz-form">`;
      if (q.type === 'multiple_choice') {
        q.options.forEach(opt => {
          html += `<label><input type="radio" name="answer" value="${opt}"> ${opt}</label>`;
        });
      } else {
        html += `<label><input type="radio" name="answer" value="True"> True</label>`;
        html += `<label><input type="radio" name="answer" value="False"> False</label>`;
      }
      html += '</form><button type="button" onclick="submitAnswer()">Submit</button>';
      container.innerHTML = html;
    }

    function submitAnswer() {
      const q = quizData[current];
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) { alert('Please select an option.'); return; }

      const correct = q.type === 'multiple_choice'
        ? selected.value === q.answer
        : (selected.value === 'True') === q.answer;

      if (correct) score++;
      current++;
      current < quizData.length ? showQuestion() : finishQuiz();
    }

    function finishQuiz() {
      const percent = Math.round((score / quizData.length) * 100);
      const passed = percent >= 80;
      try {
        if (API) {
          API.LMSSetValue('cmi.core.score.raw', String(percent));
          API.LMSSetValue('cmi.core.score.max', '100');
          API.LMSSetValue('cmi.core.score.min', '0');
          API.LMSSetValue('cmi.core.lesson_status', passed ? 'passed' : 'failed');
          API.LMSCommit('');
          API.LMSFinish('');
        }
      } catch (e) {}
      document.getElementById('quiz-container').innerHTML =
        `<div id="result">Your score: ${percent}% — ${passed ? '✓ Passed' : '✗ Not yet passed (80% required)'}</div>`;
    }

    window.addEventListener('load', () => {
      initScorm();
      if (quizData.length === 0) {
        document.getElementById('quiz-container').innerText = 'No quiz available.';
        return;
      }
      showQuestion();
    });
  </script>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div id="quiz-container">Loading quiz...</div>
</body>
</html>
